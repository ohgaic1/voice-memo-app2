# GitHub Actionsの設定ファイル
# mainブランチにプッシュされたら自動実行
#
# ★2026-08-20 改訂。それまでこのファイルには欠陥が3つあり、
#   アプリが起動しなくなっていても「✅ アプリ正常」と出し続けていた。
#   実測: gh run list で過去15回すべて success。起動しなくなった
#   2026-08-19 のコミットでも success だった。
#     ① `pytest tests/ -v || true`      … テストが落ちても緑
#     ② `curl ... || echo "⚠️ 確認..."`  … 確認が落ちても緑（|| で exit 0）
#     ③ ★実際に叩くと HTTP 303（認証への転送）。curl -f は 400 以上でしか
#        失敗しないので★303 を通す＝アプリが落ちていても「正常」と出る。
#
# ★外から叩く限り、認証の転送に阻まれて「使えるか」は判定できない。
#   そこで★このワークフローの中で実際にアプリを起動して確かめる。
#   クラウドと同じ Linux・同じ requirements.txt なので、
#   2026-08-19 の事故（shared-lib が無く ModuleNotFoundError）はここで捕まる。

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: チェックアウト
      uses: actions/checkout@v3

    - name: Python環境のセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: ffmpegのインストール
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: 依存パッケージのインストール
      run: |
        pip install -r requirements.txt
        pip install pytest

    # ★① `|| true` を外した。テストが落ちたら★このジョブは失敗する。
    - name: テストの実行
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: pytest tests/ -v

    # ★「起動した」ではなく「使える」を見る。
    #   クラウドと同じ環境で実際に起動し、ローカルで health を叩く
    #   （ローカルなので★認証の転送に邪魔されない）。
    - name: ★アプリが本当に起動して使えるか
      run: |
        set -u
        python -m streamlit run voice_memo_app.py \
          --server.headless true \
          --server.port 8501 \
          --server.address 127.0.0.1 &
        APP_PID=$!
        code=000
        for i in $(seq 1 45); do
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::★アプリの起動処理が終了しました（読み込みで落ちた可能性）"
            code=dead
            break
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 --max-time 5 http://127.0.0.1:8501/_stcore/health || echo 000)
          [ "$code" = "200" ] && break
          sleep 2
        done
        kill "$APP_PID" 2>/dev/null || true
        # ★200 だけを成功にする。3xx（転送）は成功と見なさない。
        if [ "$code" != "200" ]; then
          echo "::error::★アプリが使える状態になりません（HTTP $code）"
          exit 1
        fi
        echo "✅ 起動して health が 200 を返しました"

  health-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: 5分待機（デプロイ完了待ち）
      run: sleep 300

    # ★② `||` を外した。★③ 200 以外は成功にしない。
    #   ただし 3xx は「落ちている」ではなく★「判定できない」。
    #   認証への転送なので、アプリが落ちていても返りうる。
    #   ★判定できないことを「正常」と書かない。ここでは失敗にもしない
    #     （毎回赤になると誰も見なくなるため）。使えるかの判定は
    #     上の「アプリが本当に起動して使えるか」が受け持つ。
    - name: 公開URLの応答を見る（★判定できないときは正常と書かない）
      run: |
        set -u
        url="https://voice-memo-app2-kp26pv2z3ppxxxwko3tezf.streamlit.app/_stcore/health"
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" \
               || echo 000)
        echo "HTTP $code"
        if [ "$code" = "200" ]; then
          echo "✅ 公開URLが 200 を返しました（使えます）"
        elif [ "$code" = "000" ]; then
          echo "::error::★公開URLを叩けません（判定できません）"
          exit 1
        elif [ "$code" -ge 300 ] && [ "$code" -lt 400 ]; then
          echo "::warning::★HTTP $code（認証への転送）。使えるかは判定できません。"
          echo "★これは「正常」ではありません。"
        else
          echo "::error::★公開URLが HTTP $code を返しました（落ちています）"
          exit 1
        fi
